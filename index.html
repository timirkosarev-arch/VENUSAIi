
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090d">
  <title>Venus AI — Технические работы</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #09090d;
      color: #fff;
      font-family: Inter, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    body {
      min-height: 100svh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    .glow {
      position: fixed;
      width: 550px;
      height: 550px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(111, 76, 255, 0.17),
        rgba(111, 76, 255, 0.04) 45%,
        transparent 70%
      );
      filter: blur(35px);
      pointer-events: none;
      animation: breathe 7s ease-in-out infinite;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 580px;
      padding: 30px 25px;
      text-align: center;
      animation: appear 0.8s ease both;
    }

    .logo {
      width: 84px;
      height: 84px;
      margin: 0 auto 27px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 25px;
      background: linear-gradient(
        135deg,
        #8864ff,
        #5035bd
      );
      box-shadow: 0 10px 45px rgba(110, 70, 255, 0.27);
      font-size: 43px;
      font-weight: 700;
    }

    .brand {
      font-size: 17px;
      font-weight: 650;
      letter-spacing: 1.5px;
      color: #b7a7ff;
      margin-bottom: 29px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 9px 15px;
      margin-bottom: 23px;
      border: 1px solid rgba(173, 157, 255, 0.18);
      border-radius: 100px;
      background: rgba(139, 107, 255, 0.07);
      color: #c4b9ff;
      font-size: 13px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ac91ff;
      box-shadow: 0 0 13px #997cff;
      animation: pulse 1.7s infinite;
    }

    h1 {
      font-size: clamp(32px, 6vw, 47px);
      line-height: 1.13;
      letter-spacing: -1.6px;
      font-weight: 750;
      margin-bottom: 20px;
    }

    .gradient {
      background: linear-gradient(
        90deg,
        #b8a7ff,
        #8160ff
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .description {
      max-width: 430px;
      margin: 0 auto 31px;
      color: #9999a7;
      font-size: 16px;
      line-height: 1.8;
    }

    .loader {
      width: 180px;
      height: 3px;
      margin: 0 auto 35px;
      overflow: hidden;
      border-radius: 10px;
      background: #282534;
    }

    .loader::after {
      content: "";
      display: block;
      width: 45%;
      height: 100%;
      border-radius: inherit;
      background: #9e83ff;
      box-shadow: 0 0 15px #967aff;
      animation: loading 1.7s ease-in-out infinite;
    }

    .telegram {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 16px 25px;
      min-height: 54px;
      border-radius: 15px;
      background: #7555e9;
      color: #fff;
      font-size: 15px;
      font-weight: 650;
      text-decoration: none;
      transition: transform 0.25s ease,
                  background 0.25s ease,
                  box-shadow 0.25s ease;
    }

    .telegram:hover {
      background: #8668ff;
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(118, 84, 240, 0.25);
    }

    .telegram:active {
      transform: scale(0.97);
    }

    .telegram svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .note {
      margin-top: 19px;
      font-size: 13px;
      color: #666674;
    }

    footer {
      position: fixed;
      bottom: 23px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 12px;
      color: #52515f;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes breathe {
      0%, 100% {
        opacity: 0.55;
        transform: scale(0.9);
      }
      50% {
        opacity: 1;
        transform: scale(1.1);
      }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    @keyframes loading {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(340%); }
    }

    @media (max-width: 480px) {
      .container {
        padding: 25px 20px 65px;
      }

      .logo {
        width: 74px;
        height: 74px;
        font-size: 37px;
      }

      .description {
        font-size: 15px;
      }

      .telegram {
        width: 100%;
        max-width: 300px;
      }

      .glow {
        width: 350px;
        height: 350px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <div class="glow"></div>

  <main class="container">

    <div class="logo">V</div>

    <div class="brand">VENUS AI</div>

    <div class="status">
      <span class="dot"></span>
      Ведутся технические работы
    </div>

    <h1>
      ИИ временно<br>
      <span class="gradient">недоступна</span>
    </h1>

    <p class="description">
      Мы уже работаем над решением проблемы.
      Venus AI скоро вернётся!
      <br>
      Следите за обновлениями в нашем Telegram-канале.
    </p>

    <div class="loader"></div>

    <a
      class="telegram"
      href="https://t.me/venus1ai"
      target="_blank"
      rel="noopener noreferrer"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21.5 3.5 2.9 10.7c-1.3.5-1.3 1.3-.2 1.6l4.8 1.5 1.8 5.7c.2.7.1 1 1 .9.6 0 .9-.3 1.3-.7l2.3-2.2 4.8 3.5c.9.5 1.5.3 1.8-.8l3.1-14.7c.4-1.3-.5-1.9-1.6-1.4ZM9 13.5l10-6.3c.5-.3 1-.1.6.3l-8.2 7.4-.3 3.3-2.1-4.7Z"/>
      </svg>
      Наш Telegram-канал
    </a>

    <div class="note">
      t.me/venus1ai
    </div>

  </main>

  <footer>
    Venus AI © 2026
  </footer>

</body>
</html>
