<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0a10">
  <meta name="description" content="Venus AI временно недоступен. Следите за новостями и восстановлением сервиса в нашем Telegram-канале.">
  <title>Venus AI — Технические работы</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0a10;
      --ink: #f7f5ff;
      --muted: #a5a2b0;
      --purple: #9976f8;
      --line: rgba(255,255,255,.09);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      background: radial-gradient(ellipse at 80% 45%, #201529 0%, transparent 42%), var(--bg);
      color: var(--ink);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    .shell {
      width: min(100% - 104px, 1350px);
      min-height: 100vh;
      min-height: 100dvh;
      margin: auto;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      min-height: 88px;
      border-bottom: 1px solid var(--line);
    }
    .brand {
      display: inline-flex;
      gap: 11px;
      align-items: center;
      text-decoration: none;
      font-size: 21px;
      font-weight: 720;
      letter-spacing: -0.8px;
      white-space: nowrap;
    }
    .brand-mark { width: 25px; height: 25px; color: #c3aaff; }
    .brand b { font-weight: inherit; color: #b89bff; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 15px;
      border: 1px solid var(--line);
      border-radius: 50px;
      background: rgba(255,255,255,.035);
      color: #c7c3d0;
      font-size: 13px;
      white-space: nowrap;
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #a779fa; box-shadow: 0 0 0 3px rgba(167,121,250,.12); }
    main {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(340px, .92fr);
      gap: clamp(24px, 4vw, 72px);
      align-items: center;
      flex: 1;
      padding: 44px 0 56px;
    }
    .copy { position: relative; z-index: 1; padding: 14px 0; }
    .eyebrow {
      display: inline-flex;
      gap: 9px;
      align-items: center;
      margin-bottom: 31px;
      color: #bba3ff;
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 1.3px;
      text-transform: uppercase;
    }
    .eyebrow::before { content: ""; height: 1px; width: 25px; background: #a77fff; }
    h1 {
      margin: 0;
      max-width: 750px;
      font-size: clamp(47px, 5.8vw, 90px);
      line-height: 1.04;
      font-weight: 750;
      letter-spacing: -.065em;
    }
    h1 span { display: block; color: #a88af4; }
    .description {
      max-width: 490px;
      margin: 30px 0 0;
      color: #aaa6b4;
      font-size: 17px;
      line-height: 1.7;
      text-wrap: pretty;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-top: 39px;
    }
    .telegram {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      min-height: 54px;
      padding: 0 23px;
      border-radius: 11px;
      background: #855de8;
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: 680;
      transition: background .2s ease, transform .2s ease;
    }
    .telegram:hover { background: #9674f4; transform: translateY(-2px); }
    .telegram:focus-visible, .copy-link:focus-visible, footer a:focus-visible { outline: 2px solid #cbbaff; outline-offset: 4px; }
    .telegram svg { width: 19px; height: 19px; fill: currentColor; }
    .copy-link {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      min-height: 54px;
      padding: 0 17px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: rgba(255,255,255,.025);
      color: #c6c1cd;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    .copy-link:hover { border-color: #655582; background: rgba(255,255,255,.05); }
    .copy-link svg { width: 16px; height: 16px; }
    .art {
      position: relative;
      width: 100%;
      max-width: 540px;
      aspect-ratio: 5 / 6;
      justify-self: end;
      isolation: isolate;
    }
    .art::before {
      content: "";
      position: absolute;
      inset: 10% -4% -6% 9%;
      background: #6a3a9f;
      opacity: .25;
      filter: blur(75px);
      z-index: -1;
    }
    .photo-frame {
      width: 100%;
      height: 100%;
      border-radius: 30px;
      padding: 1px;
      overflow: hidden;
      background: linear-gradient(135deg, #8a64c2, #201b2b 50%, #6b469d);
      transform: rotate(2.4deg);
      box-shadow: 0 25px 90px rgba(0,0,0,.32);
    }
    .photo-frame img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      border-radius: 29px;
      filter: saturate(.91);
    }
    .image-note {
      position: absolute;
      left: -16px;
      bottom: 36px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 15px;
      background: rgba(21,19,29,.88);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 11px;
      color: #e0dbe9;
      font-size: 12px;
      box-shadow: 0 10px 35px rgba(0,0,0,.2);
      backdrop-filter: blur(14px);
    }
    .image-note svg { width: 18px; height: 18px; color: #b69afb; }
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      min-height: 73px;
      border-top: 1px solid var(--line);
      color: #7b7785;
      font-size: 12px;
    }
    footer a { color: #b9b3c2; text-decoration: none; }
    footer a:hover { color: white; }
    @media (min-width: 1500px) { .shell { width: min(100% - 160px, 1350px); } }
    @media (max-width: 900px) {
      .shell { width: min(100% - 56px, 740px); }
      main { grid-template-columns: 1fr 300px; gap: 24px; }
      h1 { font-size: clamp(39px, 6vw, 64px); }
      .description { font-size: 15px; }
      .art { aspect-ratio: 4 / 6; }
    }
    @media (max-width: 670px) {
      .shell { width: min(100% - 40px, 440px); }
      .topbar { min-height: 74px; }
      .brand { font-size: 19px; }
      .status { padding: 8px 10px; font-size: 11px; }
      main { display: flex; flex-direction: column; align-items: stretch; gap: 29px; padding: 46px 0 45px; }
      .copy { padding: 0; }
      .eyebrow { margin-bottom: 21px; font-size: 11px; }
      h1 { font-size: clamp(42px, 10vw, 62px); }
      .description { margin-top: 23px; font-size: 15px; }
      .actions { margin-top: 29px; }
      .telegram { flex: 1 1 180px; }
      .copy-link { flex: 1 1 135px; justify-content: center; }
      .art { width: min(86%, 335px); aspect-ratio: 1 / 1.03; align-self: center; margin: 8px 0 0; }
      .photo-frame { border-radius: 23px; }
      .photo-frame img { border-radius: 22px; object-position: 50% 23%; }
      .image-note { bottom: 16px; left: -12px; }
      footer { min-height: 70px; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand" aria-label="Venus AI">
        <svg class="brand-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 1.5c.95 5.82 2.68 8.05 8.5 9-5.82.95-7.55 3.18-8.5 9-.95-5.82-2.68-8.05-8.5-9 5.82-.95 7.55-3.18 8.5-9Z" fill="currentColor"/>
          <path d="M20 17.5c.35 1.45 1.05 2.15 2.5 2.5-1.45.35-2.15 1.05-2.5 2.5-.35-1.45-1.05-2.15-2.5-2.5 1.45-.35 2.15-1.05 2.5-2.5Z" fill="white"/>
        </svg>
        <span>Venus <b>AI</b></span>
      </div>
      <div class="status"><span class="status-dot" aria-hidden="true"></span> Технические работы</div>
    </header>

    <main>
      <section class="copy">
        <div class="eyebrow">Обновление сервиса</div>
        <h1>ИИ временно <span>недоступен.</span></h1>
        <p class="description">Сейчас мы устраняем неполадки и восстанавливаем работу Venus AI. О возобновлении работы сообщим в нашем Telegram-канале.</p>
        <div class="actions">
          <a class="telegram" href="https://t.me/venus1ai" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.9 4.5a1.4 1.4 0 0 0-1.7-1.4L2.9 9.8c-1.4.5-1.4 1.3-.2 1.7l4.4 1.4 1.7 5.2c.2.7.4 1 .9 1 .4 0 .6-.2 1-.5l2.5-2.3 4.7 3.5c.9.6 1.5.3 1.8-.8L22 5.7c.1-.5.1-.9-.1-1.2ZM9.2 17l-.8-3.2 9.4-7.3-7.2 8.4L9.2 17Z"/></svg>
            Перейти в Telegram
          </a>
          <button class="copy-link" type="button" id="copyLink" aria-label="Скопировать ссылку на Telegram">
            <span id="copyText">t.me/venus1ai</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
          </button>
        </div>
      </section>

      <div class="art" aria-label="Иллюстрация Venus AI">
        <div class="photo-frame">
          <img src="assets/venus-hero.jpg" alt="Фотография в наушниках с фиолетовой подсветкой" loading="eager">
        </div>
        <div class="image-note" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
          Скоро вернёмся
        </div>
      </div>
    </main>

    <footer>
      <span>© 2026 Venus AI</span>
      <a href="https://t.me/venus1ai" target="_blank" rel="noopener noreferrer">Новости проекта ↗</a>
    </footer>
  </div>
  <script>
    const copyButton = document.getElementById('copyLink');
    const copyText = document.getElementById('copyText');
    copyButton.addEventListener('click', async () => {
      const link = 'https://t.me/venus1ai';
      try {
        await navigator.clipboard.writeText(link);
        copyText.textContent = 'Скопировано';
        setTimeout(() => { copyText.textContent = 't.me/venus1ai'; }, 1800);
      } catch {
        window.open(link, '_blank', 'noopener,noreferrer');
      }
    });
  </script>
</body>
</html>
