
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101114;color:white;
 font-family:Arial,sans-serif;height:100dvh;
 display:flex;justify-content:center;
}
.app{width:100%;max-width:900px;height:100dvh;display:flex;flex-direction:column}
header{padding:16px 20px;border-bottom:1px solid #292a30;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#8055ff,#3a9cff);display:grid;place-items:center;font-weight:bold}
header h2{font-size:18px;margin:0}
header small{color:#999}
#messages{flex:1;overflow-y:auto;padding:22px 16px;display:flex;flex-direction:column;gap:18px}
.message{max-width:85%;padding:13px 16px;border-radius:18px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.user{align-self:flex-end;background:#6650cf}
.bot{align-self:flex-start;background:#22242b}
.welcome{text-align:center;margin:auto;color:#aaa}
.welcome h1{color:white;font-size:28px}
.bottom{padding:14px 15px 20px}
.inputbox{display:flex;align-items:flex-end;gap:10px;padding:9px;background:#202127;border:1px solid #363740;border-radius:20px}
textarea{flex:1;background:transparent;border:0;outline:0;color:white;font-size:16px;resize:none;min-height:27px;max-height:130px;font-family:inherit;padding:8px}
button{border:0;background:#7658ef;color:white;width:43px;height:43px;border-radius:14px;font-size:22px;cursor:pointer;flex-shrink:0}
button:disabled{opacity:.5}
.note{text-align:center;color:#777;font-size:11px;margin-top:10px}
@media(max-width:600px){
 header{padding:14px}
 #messages{padding:16px 12px}
 .message{max-width:91%}
 .bottom{padding:10px 10px calc(12px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="logo">AI</div>
 <div><h2>My AI</h2><small>Умный помощник</small></div>
</header>

<main id="messages">
 <div class="welcome" id="welcome">
  <h1>Привет! 👋</h1>
  <p>Я твой ИИ-помощник. Чем могу помочь?</p>
 </div>
</main>

<div class="bottom">
 <div class="inputbox">
  <textarea id="input" placeholder="Напиши сообщение..." rows="1"></textarea>
  <button id="send">↑</button>
 </div>
 <div class="note">My AI может иногда ошибаться</div>
</div>
</div>

<script>
const messages=document.getElementById('messages');
const input=document.getElementById('input');
const send=document.getElementById('send');

let history=[];
let busy=false;

function addMessage(text,role){
 const el=document.createElement('div');
 el.className='message '+role;
 el.textContent=text;
 messages.appendChild(el);
 messages.scrollTop=messages.scrollHeight;
 return el;
}

async function sendMessage(){
 const text=input.value.trim();
 if(!text||busy)return;

 busy=true;
 send.disabled=true;
 document.getElementById('welcome')?.remove();

 input.value='';
 input.style.height='auto';

 addMessage(text,'user');
 history.push({role:'user',content:text});

 const answer=addMessage('Подключение к ИИ...','bot');

 try{
  const response=await fetch('/api/chat',{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({messages:history})
  });

  if(!response.ok){
   const errorText=await response.text();
   let error=errorText;
   try{error=JSON.parse(errorText).error||errorText}catch(e){}
   throw new Error(error);
  }

  if(!response.body)throw new Error('Пустой ответ сервера');

  const reader=response.body.getReader();
  const decoder=new TextDecoder();
  let result='';
  let buffer='';

  answer.textContent='';

  while(true){
   const {done,value}=await reader.read();
   if(done)break;

   buffer+=decoder.decode(value,{stream:true});
   const lines=buffer.split('\n');
   buffer=lines.pop();

   for(const line of lines){
    if(!line.startsWith('data:'))continue;

    const data=line.slice(5).trim();
    if(!data||data==='[DONE]')continue;

    try{
     const json=JSON.parse(data);
     const part=json.choices?.[0]?.delta?.content;

     if(typeof part==='string'){
      result+=part;
      answer.textContent=result;
      messages.scrollTop=messages.scrollHeight;
     }
    }catch(e){}
   }
  }

  if(!result)throw new Error('ИИ не отправил текст');

  history.push({role:'assistant',content:result});

 }catch(error){
  answer.textContent='Ошибка: '+error.message;
  history.pop();
 }finally{
  busy=false;
  send.disabled=false;
  input.focus();
 }
}

send.addEventListener('click',sendMessage);

input.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&!e.shiftKey){
  e.preventDefault();
  sendMessage();
 }
});

input.addEventListener('input',()=>{
 input.style.height='auto';
 input.style.height=Math.min(input.scrollHeight,130)+'px';
});
</script>
</body>
</html>
