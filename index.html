<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Venus AI</title>
<style>
:root{--bg:#050505;--side:#090909;--panel:#151515;--panel2:#26143d;--line:#39205c;--text:#f5f0ff;--muted:#a995cf;--accent:#a855f7;--accent2:#7c3aed;--user:#291344;--avatar:url('https://i.ibb.co.com/wryLQv5P/photo-2026-11-03-00-49-56.jpg')}
*{box-sizing:border-box;margin:0} [hidden]{display:none!important} html,body{height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
button,input,textarea,select{font:inherit}button{color:inherit;cursor:pointer}button:disabled{opacity:.45;cursor:default}
.logo,.avatar{background:var(--avatar) center/cover no-repeat;flex-shrink:0}.logo{width:36px;height:36px;border-radius:50%;box-shadow:0 0 20px #9333ea66}.avatar{width:30px;height:30px;border-radius:50%}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #c084fc;outline-offset:2px}
/* App layout */
.app{display:flex;height:100%;min-height:0}.side{width:268px;background:var(--side);display:flex;flex-direction:column;padding:10px;gap:8px;flex-shrink:0;transition:transform .25s;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:8px 10px;font-weight:700;font-size:18px}.new{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;text-align:left;background:#1c102b}.new:hover{background:#32194e}
.list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:3px}.chat{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border:0;border-radius:10px;background:transparent;font-size:13px;gap:6px;min-width:0}.chat:hover{background:var(--panel)}.chat.on{background:var(--panel2)}.chat-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:left}.chat-delete{opacity:0;color:var(--muted);padding:3px 5px;border:0;background:transparent;border-radius:6px}.chat:hover .chat-delete{opacity:1}@media(hover:none){.chat-delete{opacity:.7}}
.foot{border-top:1px solid var(--line);padding-top:10px}.foot-actions{display:flex;gap:7px}.foot-actions .new{flex:1;justify-content:center;font-size:12px;padding:9px 5px;min-width:0;text-decoration:none}.telegram{color:#d8b4fe}.register-guest{width:100%;justify-content:center;margin:9px 0 4px;background:#211333;color:#e9d5ff}.account{display:flex;align-items:center;gap:9px;padding:12px 5px 5px;min-width:0}.account-avatar{width:30px;height:30px;border-radius:50%;background:var(--avatar) center/cover}.account-info{flex:1;min-width:0}.account-info div{font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.account-info small{font-size:11px;color:var(--muted)}.logout{padding:7px;color:#c084fc;font-size:12px;border:0;background:transparent;border-radius:8px}.logout:hover{background:var(--panel2)}
.main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%;background:#050505}.top{display:flex;align-items:center;gap:8px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));min-height:56px}.burger{display:none;padding:6px 8px;border-radius:8px;font-size:20px;background:none;border:0;color:white}.title{font-weight:600;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.top-mode{background:#211333;color:#e9d5ff;border:1px solid #6d28d9;border-radius:10px;padding:7px 10px;font-size:12px;max-width:180px}
.msgs{flex:1;overflow:auto;scroll-behavior:smooth;overscroll-behavior:contain}.wrap{max-width:800px;margin:0 auto;padding:16px 18px 24px;min-height:100%;display:flex;flex-direction:column}.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;min-height:360px}.hero .logo{width:76px;height:76px;box-shadow:0 0 50px #a855f77a}.hero h1{font-size:28px}.hero p{color:var(--muted);max-width:430px}.sugs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}.sugs button{border:1px solid #6d28d9;border-radius:14px;padding:9px 14px;font-size:13px;color:#d8b4fe;background:#101010}.sugs button:hover{background:#32194e}
.row{display:flex;gap:10px;margin:15px 0;align-items:flex-start;min-width:0}.row.u{justify-content:flex-end}.bub{min-width:0;max-width:100%;overflow-wrap:anywhere;font-size:14.5px;line-height:1.65}.u .bub{background:var(--user);padding:8px 13px;border-radius:16px;max-width:82%;white-space:pre-wrap}.bub p{margin:0 0 .65em}.bub p:last-child{margin:0}.bub ul,.bub ol{margin:0 0 .8em 1.3em}.bub h1,.bub h2,.bub h3{margin:.9em 0 .4em;line-height:1.3}.bub h1{font-size:1.4em}.bub h2{font-size:1.2em}.bub h3{font-size:1.05em}.bub code{background:var(--panel2);padding:1px 6px;border-radius:6px;font:13px ui-monospace,monospace}.bub a{color:#c084fc}.bub blockquote{border-left:3px solid #8b5cf6;padding-left:12px;color:#c9b8e2;margin:.5em 0}
.pre{background:#0c0618;border:1px solid var(--line);border-radius:12px;margin:.6em 0 .9em;overflow:hidden;max-width:100%}.pre .h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 12px;background:var(--panel);font-size:12px;color:var(--muted)}.code-actions{display:flex;gap:10px}.pre .h button{background:none;border:0;color:#c084fc;cursor:pointer;font-size:11px}.pre pre{padding:12px;overflow:auto;font:13px/1.5 ui-monospace,monospace;max-width:100%}.pre code{background:none;padding:0}.dots{display:inline-flex;gap:4px;padding:8px 0}.dots i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:b 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1;transform:translateY(-3px)}}.err{color:#ff9db0;background:#3a1020;border:1px solid #6b2040;padding:10px 14px;border-radius:12px}.message-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.message-actions button{border:1px solid var(--line);border-radius:9px;padding:6px 9px;color:#d8b4fe;background:#100b17;font-size:11px}.message-actions button:hover{background:#2a1740;border-color:var(--accent)}
.comp{padding:8px 14px calc(14px + env(safe-area-inset-bottom,0px))}.box{max-width:800px;margin:0 auto;background:var(--panel);border:1px solid #33243f;border-radius:21px;display:flex;align-items:flex-end;gap:7px;padding:6px 8px 6px 14px}.box:focus-within{border-color:#72509a}textarea{flex:1;background:none;border:0;outline:0;color:var(--text);resize:none;max-height:170px;min-width:0;min-height:34px;padding:5px 0;line-height:1.5}textarea::placeholder{color:var(--muted)}.attach,.send{width:36px;height:36px;flex-shrink:0;display:grid;place-items:center;border-radius:50%;border:0}.attach{background:#211333;color:#e9d5ff;font-size:19px;border:1px solid var(--line)}.attach:hover{background:#39205c}.send{background:linear-gradient(135deg,#a855f7,#6d28d9);color:white}.send:hover{background:linear-gradient(135deg,#c084fc,#9333ea)}.note{text-align:center;font-size:11px;color:var(--muted);margin-top:8px}.attachment-tray{max-width:800px;margin:9px auto 0;display:flex;flex-wrap:wrap;gap:8px}.attachment-item{position:relative;width:92px;min-height:76px;background:#17101f;border:1px solid var(--line);border-radius:12px;padding:6px;overflow:hidden;display:flex;flex-direction:column;gap:4px}.attachment-item img{width:100%;height:62px;object-fit:cover;border-radius:7px}.file-icon{font-size:25px;text-align:center;line-height:40px}.file-name{font-size:10px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.remove-attachment{position:absolute;right:4px;top:4px;width:22px;height:22px;border-radius:50%;background:#090909dd;color:#fff;border:0;display:grid;place-items:center;font-size:13px}.attachment-hint{font-size:11px;color:var(--muted);width:100%}.user-attachments{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;max-width:340px}.user-attachments img{width:min(180px,42vw);height:145px;object-fit:cover;border-radius:11px;border:1px solid var(--line);background:#111}.user-file{display:flex;align-items:center;gap:7px;padding:7px 10px;background:#17101f;border:1px solid var(--line);border-radius:9px;color:#e9d5ff;font-size:12px;max-width:230px}.user-file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Modals and auth */
.mod{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:16px;z-index:40}.mod.on{display:flex}.card{background:#151515;border:1px solid var(--line);border-radius:18px;padding:20px;width:100%;max-width:460px;display:flex;flex-direction:column;gap:12px;max-height:90dvh;overflow:auto}.card h2{font-size:18px}.card label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:5px}.card textarea{background:#090909;border:1px solid var(--line);border-radius:10px;padding:12px;color:white;width:100%;min-height:140px;max-height:250px}.btns{display:flex;gap:8px;justify-content:flex-end}.btn{padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:#211333;color:white}.btn.primary{background:linear-gradient(135deg,#a855f7,#6d28d9);border:0}.auth-screen{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 50% 15%,#35125355,transparent 55%),#050505}.auth-card{width:100%;max-width:420px;padding:26px;border:1px solid var(--line);border-radius:22px;background:#101010;box-shadow:0 15px 70px #000}.auth-head{text-align:center;margin-bottom:20px}.auth-head .logo{width:70px;height:70px;margin:0 auto 12px}.auth-head h1{font-size:26px}.auth-head p{color:var(--muted);font-size:13px}.auth-form{display:flex;flex-direction:column;gap:10px}.auth-form input{width:100%;padding:12px 14px;border-radius:11px;border:1px solid var(--line);outline:none;background:#090909;color:white}.auth-primary{width:100%;padding:12px;border:0;border-radius:11px;background:linear-gradient(135deg,#a855f7,#6d28d9);font-weight:700}.auth-switch{width:100%;margin-top:14px;color:#c084fc;font-size:13px;background:none;border:0}.auth-error{display:none;color:#ff9db0;font-size:12px;padding:9px;background:#35101e;border-radius:9px}.auth-google{width:100%;padding:11px;background:#f5f5f5;color:#171717;border-radius:12px;font-weight:600;border:0;margin-bottom:12px}.google-g{color:#4285f4;font-weight:900;margin-right:8px}.auth-divider{text-align:center;color:var(--muted);font-size:12px;margin:6px 0 12px}
.back{display:none}
@media(max-width:800px){.side{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);width:min(280px,85vw)}.side.on{transform:none}.back.on{display:block;position:fixed;inset:0;background:#0009;z-index:15}.burger{display:block}}
@media(max-width:600px){.top{padding-left:10px;padding-right:10px}.wrap{padding:10px 12px 20px}.hero{min-height:310px}.hero h1{font-size:24px}.comp{padding:8px 9px calc(10px + env(safe-area-inset-bottom,0px))}.u .bub{max-width:88%}.bub{font-size:14px}.top-mode{max-width:145px;font-size:11px}.attachment-tray{padding:0 4px}}
::-webkit-scrollbar{width:7px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
</style>
</head>
<body>
<div class="app" id="app">
 <aside class="side" id="side">
  <div class="brand"><div class="logo"></div>Venus AI</div>
  <button class="new" id="newBtn">＋ Новый чат</button>
  <div class="list" id="list"></div>
  <div class="foot">
   <div class="foot-actions">
    <button class="new" id="setBtn">⚙ Настройки</button>
    <a class="new telegram" href="https://t.me/venus1ai" target="_blank" rel="noopener">✈ Telegram</a>
   </div>
   <button class="new register-guest" id="registerBtn">Войти / Регистрация</button>
   <div class="account">
    <div class="account-avatar"></div>
    <div class="account-info"><div id="accountName">Гость</div><small id="accountEmail">История на этом устройстве</small></div>
    <button class="logout" id="logoutBtn" hidden>Выйти</button>
   </div>
  </div>
 </aside>
 <div class="back" id="back"></div>
 <main class="main">
  <div class="top">
   <button class="burger" id="burger" aria-label="Открыть меню">☰</button>
   <div class="title" id="ttl">Venus AI</div>
   <select class="top-mode" id="modelSelect" aria-label="Режим модели">
    <option value="normal">Обычный · Nemotron</option>
    <option value="flash">⚡ Flash · Gemini</option>
   </select>
  </div>
  <div class="msgs" id="msgs"><div class="wrap" id="wrap"></div></div>
  <div class="comp">
   <div class="box">
    <textarea id="inp" rows="1" placeholder="Напишите сообщение Venus AI…" aria-label="Сообщение"></textarea>
    <button class="attach" id="attachBtn" type="button" title="Прикрепить фото или файл" aria-label="Прикрепить файл">📎</button>
    <input id="fileInput" type="file" hidden multiple accept="image/*,.pdf,.txt,.md,.json,.csv,.html,.htm,.css,.js,.mjs,.ts,.tsx,.jsx,.py,.lua,.java,.c,.cpp,.h,.cs,.go,.rs,.sql,.xml,.yaml,.yml,.toml,.ini,.log,.sh,.docx,.xlsx">
    <button class="send" id="sendBtn" disabled aria-label="Отправить"><span id="sendIcon">↑</span></button>
   </div>
   <div class="attachment-tray" id="attachmentTray" hidden></div>
   <div class="note">Можно прикреплять изображения, PDF, DOCX, XLSX и текстовые файлы. Shift + Enter — новая строка.</div>
  </div>
 </main>
</div>

<!-- Settings -->
<div class="mod" id="settingsModal">
 <div class="card">
  <h2>Настройки Venus AI</h2>
  <label>Системная инструкция<textarea id="systemPrompt" placeholder="Ты Venus AI — дружелюбный и умный ИИ-помощник."></textarea></label>
  <div class="btns"><button class="btn" id="closeSettings">Закрыть</button><button class="btn primary" id="saveSettings">Сохранить</button></div>
 </div>
</div>

<!-- Auth -->
<div class="auth-screen" id="authScreen" hidden>
 <div class="auth-card">
  <div class="auth-head"><div class="logo"></div><h1>Venus AI</h1><p id="authSubtitle">Войдите, чтобы продолжить</p></div>
  <button class="auth-google" id="googleBtn"><span class="google-g">G</span>Продолжить с Google</button>
  <div class="auth-divider">или через аккаунт</div>
  <form class="auth-form" id="authForm">
   <input id="authName" placeholder="Имя пользователя" autocomplete="nickname" hidden>
   <input id="authEmail" type="email" placeholder="Email" autocomplete="email" required>
   <input id="authPassword" type="password" placeholder="Пароль" autocomplete="current-password" minlength="6" required>
   <input id="authConfirm" type="password" placeholder="Повторите пароль" autocomplete="new-password" minlength="6" hidden>
   <div class="auth-error" id="authError"></div>
   <button class="auth-primary" id="authSubmit" type="submit">Войти</button>
  </form>
  <button class="auth-switch" id="authSwitch">Нет аккаунта? Зарегистрироваться</button>
  <button class="auth-switch" id="authBack">Продолжить как гость</button>
 </div>
</div>

<script type="module">
const $=id=>document.getElementById(id);
const DEFAULT_SYSTEM='Ты Venus AI — дружелюбный и умный ИИ-помощник. Отвечай на языке пользователя. Давай точные и полезные ответы. Для программирования предоставляй полный рабочий код, учитывай предыдущий контекст и объясняй ошибки.';
const CHAT_KEY='venus_chats_v3_';
const SYSTEM_KEY='venus_system_v3_';
const MODEL_KEY='venus_model_v3_';
const MAX_FILES=5,MAX_FILE_BYTES=12*1024*1024,MAX_TEXT=120000;
const TEXT_EXTENSIONS=new Set(['txt','md','markdown','json','csv','html','htm','css','js','mjs','ts','tsx','jsx','py','lua','java','c','cpp','h','cs','go','rs','sql','xml','yaml','yml','toml','ini','log','sh']);
let currentUser={uid:'guest',displayName:'Гость',email:''};
let chats=[],activeId=null,busy=false,controller=null,systemPrompt=DEFAULT_SYSTEM,authMode='login',pending=[];
let mediaDB=null;const memoryMedia=new Map();

function readStore(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}}
function writeStore(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch(e){console.warn('localStorage full',e)}}
function storageKey(){return CHAT_KEY+(currentUser?.uid||'guest')}
function saveChats(){writeStore(storageKey(),chats)}
function saveSystem(){writeStore(SYSTEM_KEY+(currentUser?.uid||'guest'),systemPrompt)}
function saveModel(mode){writeStore(MODEL_KEY+(currentUser?.uid||'guest'),mode)}
function active(){return chats.find(c=>c.id===activeId)||null}
function makeId(){return crypto.randomUUID?.()||'m'+Date.now()+Math.random().toString(16).slice(2)}
function cleanName(s){return String(s||'file').replace(/[^a-z0-9а-яё_.-]+/gi,'_').slice(0,70)||'file'}
function scrollBottom(){ $('msgs').scrollTop=$('msgs').scrollHeight }

/* IndexedDB keeps attachment bytes between reloads. */
function openMediaDB(){return new Promise((resolve,reject)=>{
 if(!('indexedDB'in window)){resolve(null);return}
 const request=indexedDB.open('venus-ai-media-v1',1);
 request.onupgradeneeded=()=>{const db=request.result;if(!db.objectStoreNames.contains('files'))db.createObjectStore('files',{keyPath:'id'})};
 request.onsuccess=()=>{mediaDB=request.result;resolve(mediaDB)};
 request.onerror=()=>reject(request.error);
})}
async function putMedia(item){if(!mediaDB){memoryMedia.set(item.id,item);return}
 return new Promise((resolve,reject)=>{const tx=mediaDB.transaction('files','readwrite');tx.objectStore('files').put(item);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function getMedia(id){if(!mediaDB)return memoryMedia.get(id)||null;return new Promise((resolve,reject)=>{const tx=mediaDB.transaction('files','readonly');const req=tx.objectStore('files').get(id);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error)})}

function createChat(){const chat={id:makeId(),title:'Новый чат',mode:readStore(MODEL_KEY+(currentUser?.uid||'guest'),'normal'),messages:[],updatedAt:Date.now()};chats.unshift(chat);activeId=chat.id;saveChats();renderAll();closeSide();return chat}
function renderList(){const list=$('list');list.replaceChildren();[...chats].sort((a,b)=>b.updatedAt-a.updatedAt).forEach(chat=>{
 const row=document.createElement('div');row.className='chat'+(chat.id===activeId?' on':'');
 const title=document.createElement('button');title.className='chat-title';title.textContent=chat.title||'Новый чат';title.onclick=()=>{if(busy)return;activeId=chat.id;setModeUI(chat.mode);renderAll();closeSide()};
 const del=document.createElement('button');del.className='chat-delete';del.textContent='✕';del.title='Удалить чат';del.setAttribute('aria-label','Удалить чат');del.onclick=e=>{e.stopPropagation();deleteChat(chat.id)};
 row.append(title,del);list.append(row);
 })}
function deleteChat(id){if(busy)return;const c=chats.find(x=>x.id===id);if(!c)return;if(!confirm(`Удалить чат «${c.title}»?`))return;chats=chats.filter(x=>x.id!==id);if(activeId===id)activeId=chats[0]?.id||null;saveChats();renderAll()}
function setModeUI(mode){const safe=mode==='flash'?'flash':'normal';$('modelSelect').value=safe;saveModel(safe);const c=active();if(c){c.mode=safe;c.updatedAt=Date.now();saveChats()}}
function renderAll(){renderList();renderMessages();const c=active();$('ttl').textContent=c?.title||'Venus AI';$('modelSelect').value=c?.mode||readStore(MODEL_KEY+(currentUser?.uid||'guest'),'normal');$('accountName').textContent=currentUser.displayName||'Гость';$('accountEmail').textContent=currentUser.email||'История на этом устройстве';$('logoutBtn').hidden=currentUser.uid==='guest';$('registerBtn').hidden=currentUser.uid!=='guest';requestAnimationFrame(scrollBottom)}

/* Safe Markdown renderer, including fenced code with copy/download actions. */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function markdown(source){
 const blocks=[];let text=String(source||'').replace(/```([\w+-]*)\n?([\s\S]*?)```/g,(all,lang,code)=>{blocks.push({lang:lang||'code',code});return `\u0000${blocks.length-1}\u0000`});
 text=esc(text);
 const inline=s=>s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
 const lines=text.split('\n');let out='',list=null;
 const close=()=>{if(list){out+=`</${list}>`;list=null}};
 for(const line of lines){let m;
  if((m=line.match(/^(#{1,3})\s+(.*)$/))){close();const n=m[1].length;out+=`<h${n}>${inline(m[2])}</h${n}>`}
  else if((m=line.match(/^\s*[-*]\s+(.*)$/))){if(list!=='ul'){close();out+='<ul>';list='ul'}out+=`<li>${inline(m[1])}</li>`}
  else if((m=line.match(/^\s*\d+[.)]\s+(.*)$/))){if(list!=='ol'){close();out+='<ol>';list='ol'}out+=`<li>${inline(m[1])}</li>`}
  else if((m=line.match(/^&gt;\s?(.*)$/))){close();out+=`<blockquote>${inline(m[1])}</blockquote>`}
  else if(!line.trim()){close()}
  else if(/^\u0000\d+\u0000$/.test(line.trim())){close();out+=line.trim()}
  else{close();out+=`<p>${inline(line)}</p>`}
 }
 close();
 return out.replace(/\u0000(\d+)\u0000/g,(_,idx)=>{const b=blocks[Number(idx)];return `<div class="pre"><div class="h"><span>${esc(b.lang)}</span><div class="code-actions"><button type="button" data-copy-code>Копировать</button><button type="button" data-download-code>Скачать</button></div></div><pre><code>${esc(b.code.replace(/\n$/,''))}</code></pre></div>`});
}
function heroHTML(){return `<div class="hero"><div class="logo"></div><h1>Чем могу помочь?</h1><p>Я Venus AI. Задайте вопрос, попросите написать текст или код.</p><div class="sugs"><button data-s="Придумай идею для интересного проекта">💡 Придумай идею для проекта</button><button data-s="Объясни сложную тему простыми словами">📚 Объясни сложную тему</button><button data-s="Напиши адаптивный HTML сайт">💻 Напиши код</button><button data-s="Помоги составить план обучения английскому">✍️ Помоги с обучением</button></div></div>`}
function renderUserAttachments(attachments){if(!attachments?.length)return '';return `<div class="user-attachments">${attachments.map(a=>a.kind==='image'?`<img data-media-id="${esc(a.mediaId)}" alt="${esc(a.name)}" loading="lazy">`:`<div class="user-file">📄 <span>${esc(a.name)}</span></div>`).join('')}</div>`}
function renderMessages(){const c=active();$('ttl').textContent=c?.title||'Venus AI';const wrap=$('wrap');wrap.replaceChildren();if(!c||!c.messages.length){wrap.innerHTML=heroHTML();return}
 c.messages.forEach((m,index)=>{const row=document.createElement('div');row.className='row'+(m.role==='user'?' u':'');const bub=document.createElement('div');bub.className='bub';
  if(m.role==='user'){bub.textContent=m.content||'Прикреплённые файлы';bub.insertAdjacentHTML('beforeend',renderUserAttachments(m.attachments))}

  if(m.role==='assistant'){const av=document.createElement('div');av.className='avatar';row.append(av,bub)}else row.append(bub);wrap.append(row);
 });hydrateImages();}
async function hydrateImages(){for(const img of $('wrap').querySelectorAll('img[data-media-id]')){try{const item=await getMedia(img.dataset.mediaId);if(item?.dataUrl)img.src=item.dataUrl;else img.alt='Вложение недоступно — прикрепите его повторно'}catch{img.alt='Вложение недоступно'}}}

/* File extraction */
function extOf(name){return (name.split('.').pop()||'').toLowerCase()}
function formatBytes(n){return n<1048576?Math.round(n/1024)+' КБ':(n/1048576).toFixed(1)+' МБ'}
async function imageToDataURL(file){const bitmap=await createImageBitmap(file);const max=1280,scale=Math.min(1,max/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close?.();return canvas.toDataURL('image/jpeg',.7)}
async function extractPDF(file){const pdfjs=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs');pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';const pdf=await pdfjs.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;const pages=[];for(let p=1;p<=Math.min(pdf.numPages,35);p++){const page=await pdf.getPage(p);const content=await page.getTextContent();pages.push(content.items.map(x=>x.str).join(' '));if(pages.join('\n').length>MAX_TEXT)break}let result=pages.join('\n\n');if(pdf.numPages>35)result+='\n[Извлечены первые 35 страниц]';return result.slice(0,MAX_TEXT)}
async function extractDOCX(file){const mod=await import('https://esm.sh/mammoth@1.9.0?bundle');const mammoth=mod.default||mod;const r=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});return (r.value||'').slice(0,MAX_TEXT)}
async function extractXLSX(file){const XLSX=await import('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm');const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});const out=[];for(const name of wb.SheetNames){out.push('Лист: '+name+'\n'+XLSX.utils.sheet_to_csv(wb.Sheets[name]));if(out.join('\n').length>MAX_TEXT)break}return out.join('\n\n').slice(0,MAX_TEXT)}
async function prepareFile(file){if(file.size>MAX_FILE_BYTES)throw new Error(`${file.name}: размер больше 12 МБ`);const id=makeId(),ext=extOf(file.name);const item={id,name:file.name,type:file.type||'application/octet-stream',kind:'file'};
 if(file.type.startsWith('image/')){item.kind='image';item.dataUrl=await imageToDataURL(file)}
 else if(file.type==='application/pdf'||ext==='pdf'){item.kind='document';item.text=await extractPDF(file)}
 else if(ext==='docx'){item.kind='document';item.text=await extractDOCX(file)}
 else if(ext==='xlsx'){item.kind='document';item.text=await extractXLSX(file)}
 else if(TEXT_EXTENSIONS.has(ext)||file.type.startsWith('text/')){item.kind='document';item.text=(await file.text()).slice(0,MAX_TEXT)}
 else throw new Error(`${file.name}: этот формат не поддерживается`);
 await putMedia(item);return {id,mediaId:id,name:file.name,type:item.type,kind:item.kind,previewUrl:item.dataUrl||''};}
function renderPending(){const tray=$('attachmentTray');tray.hidden=!pending.length;tray.replaceChildren();pending.forEach((a,i)=>{const card=document.createElement('div');card.className='attachment-item';if(a.kind==='image'){const img=document.createElement('img');img.src=a.previewUrl;img.alt=a.name;card.append(img)}else{const icon=document.createElement('div');icon.className='file-icon';icon.textContent='📄';card.append(icon)}const name=document.createElement('div');name.className='file-name';name.textContent=a.name;name.title=a.name;const remove=document.createElement('button');remove.className='remove-attachment';remove.type='button';remove.textContent='×';remove.title='Убрать файл';remove.onclick=()=>{pending.splice(i,1);renderPending();updateSendButton()};card.append(name,remove);tray.append(card)});if(pending.length){const hint=document.createElement('div');hint.className='attachment-hint';hint.textContent=`${pending.length}/${MAX_FILES} файлов`;tray.append(hint)}}
async function addFiles(files){const chosen=Array.from(files||[]).slice(0,MAX_FILES-pending.length);if(!chosen.length){$('fileInput').value='';return} $('attachBtn').disabled=true;try{for(const file of chosen){const item=await prepareFile(file);pending.push(item)}renderPending();updateSendButton()}catch(e){alert('Не удалось прикрепить файл: '+e.message)}finally{$('attachBtn').disabled=false;$('fileInput').value=''}}

/* Construct API history, including system prompt, extracted text and image data. */
async function buildMessages(chat){const out=[];if(systemPrompt)out.push({role:'system',content:systemPrompt});for(const m of chat.messages){const attachments=Array.isArray(m.attachments)?m.attachments:[];if(m.role!=='user'||!attachments.length){out.push({role:m.role,content:m.content||''});continue}let text=m.content||'';const images=[];for(const a of attachments){let stored=null;try{stored=await getMedia(a.mediaId)}catch{}if(!stored){text+=`\n[Файл «${a.name}» недоступен. Прикрепите его повторно.]`;continue}if(a.kind==='image'&&stored.dataUrl){images.push({type:'image_url',image_url:{url:stored.dataUrl,detail:'auto'}});text+=`\n[Изображение: ${a.name}. Проанализируй его.]`}else if(typeof stored.text==='string'){text+=`\n\n===== ФАЙЛ ${a.name} =====\n${stored.text}\n===== КОНЕЦ ФАЙЛА =====`}else{text+=`\n[Не удалось прочитать ${a.name}]`}}
 if(images.length)out.push({role:'user',content:[{type:'text',text:text||'Проанализируй изображение.'},...images]});else out.push({role:'user',content:text||'Изучи прикреплённые файлы.'})}return out}

function renderLive(content){const row=document.createElement('div');row.className='row';const avatar=document.createElement('div');avatar.className='avatar';const bub=document.createElement('div');bub.className='bub';bub.innerHTML=content?markdown(content):'<div class="dots"><i></i><i></i><i></i></div>';row.append(avatar,bub);$('wrap').append(row);scrollBottom();return bub}
function updateSendButton(){const b=$('sendBtn');if(busy){b.disabled=false;$('sendIcon').textContent='■';b.title='Остановить генерацию'}else{b.disabled=!$('inp').value.trim()&&!pending.length;$('sendIcon').textContent='↑';b.title='Отправить сообщение'}}

function download(content,filename,mime='text/plain;charset=utf-8'){const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function extForLanguage(lang){const map={javascript:'js',js:'js',typescript:'ts',ts:'ts',tsx:'tsx',jsx:'jsx',python:'py',py:'py',html:'html',css:'css',json:'json',xml:'xml',yaml:'yml',yml:'yml',markdown:'md',md:'md',sql:'sql',bash:'sh',sh:'sh',lua:'lua',java:'java',c:'c',cpp:'cpp',csharp:'cs',cs:'cs',go:'go',rust:'rs',rs:'rs',php:'php',ruby:'rb',rb:'rb',swift:'swift',kotlin:'kt',text:'txt',txt:'txt'};return map[lang]||'txt'}

async function requestAnswer(chat){if(busy)return;busy=true;controller=new AbortController();updateSendButton();const live=renderLive('');try{const apiMessages=await buildMessages(chat);const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},signal:controller.signal,body:JSON.stringify({messages:apiMessages,mode:chat.mode||'normal'})});if(!response.ok){const raw=await response.text();let message=raw;try{message=JSON.parse(raw).error||raw}catch{}throw new Error(message.slice(0,600))}if(!response.body)throw new Error('Пустой ответ сервера');const ct=response.headers.get('content-type')||'';let result='';
 if(ct.includes('text/event-stream')){const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='';const parseLine=line=>{line=line.trim();if(!line.startsWith('data:'))return;const data=line.slice(5).trim();if(!data||data==='[DONE]')return;let json;try{json=JSON.parse(data)}catch{return}if(json.error)throw new Error(json.error.message||'Ошибка модели');let piece=json.choices?.[0]?.delta?.content??'';if(Array.isArray(piece))piece=piece.map(x=>x.text||'').join('');if(typeof piece==='string'&&piece){result+=piece;live.innerHTML=markdown(result);scrollBottom()}};while(true){const {done,value}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});const lines=buffer.split('\n');buffer=lines.pop();for(const line of lines)parseLine(line)}buffer+=decoder.decode();if(buffer.trim())parseLine(buffer)}
 else{const raw=await response.text();let data;try{data=JSON.parse(raw)}catch{throw new Error('Сервер вернул не JSON и не потоковый ответ: '+raw.slice(0,200))}if(data.error)throw new Error(data.error.message||data.error);const content=data.choices?.[0]?.message?.content??'';result=typeof content==='string'?content:Array.isArray(content)?content.map(x=>x.text||'').join(''):String(content);live.innerHTML=markdown(result)}
 if(!result.trim())throw new Error('Модель не вернула текстовый ответ');chat.messages.push({role:'assistant',content:result});chat.updatedAt=Date.now();saveChats();renderMessages();renderList();
 }catch(e){if(e.name==='AbortError'){if(live.textContent.trim()&&live.textContent.trim()!==''){const partial=live.textContent;chat.messages.push({role:'assistant',content:partial+'\n\n[Ответ остановлен]'});saveChats();renderMessages()}else{const row=live.closest('.row');row?.remove()}}else{live.innerHTML=`<div class="err">⚠ ${esc(e.message||'Ошибка запроса')}</div>`;console.error(e)}}finally{busy=false;controller=null;updateSendButton();}}
async function sendMessage(text=$('inp').value,attachmentsOverride=null){text=String(text||'').trim();const files=attachmentsOverride===null?pending.slice():attachmentsOverride.slice();if((!text&&!files.length)||busy)return;if(!text&&files.length)text='Посмотри прикреплённые файлы и помоги с ними.';let chat=active();if(!chat)chat=createChat();if(!chat.messages.length){const basis=files[0]?.name||text;chat.title=basis.length>42?basis.slice(0,42)+'…':basis}const attachments=files.map(a=>({mediaId:a.mediaId,name:a.name,type:a.type,kind:a.kind}));chat.messages.push({role:'user',content:text,attachments});chat.updatedAt=Date.now();if(attachmentsOverride===null){pending=[];renderPending()}$('inp').value='';autoGrow();saveChats();renderAll();closeSide();await requestAnswer(chat)}
function retryMessage(answerIndex){if(busy)return;const chat=active();if(!chat)return;const userIndex=answerIndex-1;if(userIndex<0||chat.messages[userIndex]?.role!=='user')return;chat.messages=chat.messages.slice(0,userIndex+1);saveChats();renderMessages();requestAnswer(chat)}

function showAuthError(message){$('authError').textContent=message;$('authError').style.display='block'}function clearAuthError(){$('authError').textContent='';$('authError').style.display='none'}
function setAuthMode(mode){authMode=mode;const register=mode==='register';$('authName').hidden=!register;$('authConfirm').hidden=!register;$('authName').required=register;$('authConfirm').required=register;$('authPassword').autocomplete=register?'new-password':'current-password';$('authSubmit').textContent=register?'Зарегистрироваться':'Войти';$('authSwitch').textContent=register?'Уже есть аккаунт? Войти':'Нет аккаунта? Зарегистрироваться';$('authSubtitle').textContent=register?'Создайте аккаунт Venus AI':'Войдите, чтобы продолжить';clearAuthError()}

oid|iPhone|iPad|iPod/i.test(navigator.userAgent)){await authMod.signInWithRedirect(auth,provider)}else{await authMod.signInWithPopup(auth,provider)}}catch(err){try{if(err.code==='auth/popup-blocked'||err.code==='auth/popup-closed-by-user'){await authMod.signInWithRedirect(auth,provider)}else showAuthError(err.message||'Не удалось войти через Google')}catch(fallback){showAuthError(fallback.message||'Не удалось войти через Google')}}};await authMod.getRedirectResult(auth).catch(err=>console.warn('Google redirect:',err));$('logoutBtn').onclick=async()=>{try{saveChats();await authMod.signOut(auth)}catch(err){alert(err.message)}};await authMod.getRedirectResult(auth).catch(()=>{});return true}catch(err){console.warn('Firebase auth unavailable; guest mode enabled:',err);$('registerBtn').title='Firebase сейчас недоступен';return false}}
