
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101113">

  <title>Venus AI — Временно недоступен</title>

  <style>
    :root {
      --bg: #101113;
      --text: #f2f2f3;
      --muted: #8a8b91;
      --border: #292a2e;
      --accent: #a0a2ff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
    }

    .page {
      min-height: 100vh;
      min-height: 100dvh;
      max-width: 1440px;
      margin: auto;
      padding: 0 64px;

      display: flex;
      flex-direction: column;
    }

    header {
      height: 96px;
      flex-shrink: 0;

      display: flex;
      justify-content: space-between;
      align-items: center;

      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-size: 22px;
      font-weight: 750;
      letter-spacing: -1px;
    }

    .brand span {
      color: var(--accent);
    }

    .header-status {
      display: flex;
      align-items: center;
      gap: 10px;

      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #d6a86d;
    }

    main {
      width: 100%;
      flex: 1;

      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;

      padding: 80px 0 100px;
    }

    .eyebrow {
      margin-bottom: 28px;
      color: var(--accent);

      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }

    h1 {
      max-width: 850px;
      margin: 0;

      font-size: clamp(44px, 6.8vw, 92px);
      font-weight: 650;
      letter-spacing: -0.065em;
      line-height: 1.07;
    }

    .secondary {
      color: #6e6f76;
    }

    .description {
      max-width: 490px;
      margin: 36px 0 0;

      color: var(--muted);
      font-size: 17px;
      line-height: 1.75;
    }

    .actions {
      margin-top: 42px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    .telegram {
      min-height: 51px;
      padding: 0 21px;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 13px;

      background: #f2f2f3;
      color: #101113;

      border-radius: 8px;
      text-decoration: none;

      font-size: 14px;
      font-weight: 650;

      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    .telegram:hover {
      background: #d9d9dd;
      transform: translateY(-2px);
    }

    .telegram:active {
      transform: translateY(0);
    }

    .telegram svg {
      width: 17px;
      height: 17px;
    }

    .channel {
      display: inline-flex;
      align-items: center;
      color: var(--muted);

      font-size: 13px;
    }

    footer {
      min-height: 85px;
      border-top: 1px solid var(--border);

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;

      color: #65666e;
      font-size: 12px;
    }

    footer a {
      text-decoration: none;
      color: #9798a0;
    }

    footer a:hover {
      color: #fff;
    }

    @media (max-width: 700px) {
      .page {
        padding: 0 25px;
      }

      header {
        height: 76px;
      }

      .brand {
        font-size: 20px;
      }

      .header-status {
        font-size: 11px;
      }

      main {
        padding: 90px 0;
      }

      h1 {
        font-size: clamp(43px, 10vw, 65px);
        letter-spacing: -0.055em;
      }

      .description {
        margin-top: 28px;
        font-size: 15px;
      }

      .actions {
        margin-top: 35px;
      }

      footer {
        min-height: 75px;
      }
    }

    @media (max-width: 370px) {
      .header-status {
        font-size: 0;
        gap: 0;
      }

      .status-dot {
        width: 8px;
        height: 8px;
      }

      h1 {
        font-size: 42px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .telegram {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <header>
      <div class="brand">
        venus<span>.</span>ai
      </div>

      <div class="header-status">
        <span class="status-dot"></span>
        Технические работы
      </div>
    </header>

    <main>
      <div class="eyebrow">
        Обновление сервиса
      </div>

      <h1>
        Временно<br>
        <span class="secondary">недоступен.</span>
      </h1>

      <p class="description">
        Сейчас Venus AI не работает.
        Мы разбираемся с проблемой и восстанавливаем
        работу сервиса.
        <br><br>
        О возвращении сообщим в Telegram.
      </p>

      <div class="actions">
        <a
          class="telegram"
          href="https://t.me/venus1ai"
          target="_blank"
          rel="noopener noreferrer"
        >
          Перейти в Telegram

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M5 12h14"/>
            <path d="m12 5 7 7-7 7"/>
          </svg>
        </a>

        <span class="channel">
          @venus1ai
        </span>
      </div>
    </main>

    <footer>
      <span>© 2026 Venus AI</span>

      <a
        href="https://t.me/venus1ai"
        target="_blank"
        rel="noopener noreferrer"
      >
        Новости проекта
      </a>
    </footer>

  </div>

</body>
</html>
